name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vercel legacy page (blank; app lives on Hostinger)
        run: npm run build:vercel-legacy

      - name: Verify legacy Vercel bundle
        run: |
          test -f dist/index.html
          test ! -f dist/gallery.html
          ! grep -qE 'giphy|/src/main' dist/index.html
