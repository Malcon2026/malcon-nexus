name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app + gallery + TV board
        run: npm run build

      - name: Verify gallery and TV bundles
        run: |
          test -f dist/gallery.html
          grep -q "Malcon Gallery" dist/gallery.html
          test -f dist/tv.html
          grep -q "Malcon Nexus — TV Board" dist/tv.html
