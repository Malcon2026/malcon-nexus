<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" />
    <title>Opening Malcon Nexus…</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      }
      h1 { font-size: 1.125rem; margin: 0 0 8px; }
      p { font-size: 0.9375rem; line-height: 1.5; color: #475569; margin: 0 0 16px; }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        margin-top: 8px;
      }
      .btn-primary { background: #4338ca; color: #fff; }
      .btn-secondary { background: #f1f5f9; color: #334155; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Opening Malcon Nexus…</h1>
      <p id="message">Please wait.</p>
      <a id="home-btn" class="btn btn-primary hidden" href="/">Continue in browser</a>
      <a id="browser-btn" class="btn btn-secondary hidden" href="/">Open in browser instead</a>
    </div>
    <script>
      (function () {
        var appUrl = location.origin + '/';
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;

        if (isStandalone) {
          location.replace(appUrl);
          return;
        }

        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isInAppBrowser =
          /Telegram/i.test(ua) ||
          /FBAN|FBAV|Instagram|Line\//i.test(ua) ||
          /wv\)/i.test(ua);

        var title = document.getElementById('title');
        var message = document.getElementById('message');
        var homeBtn = document.getElementById('home-btn');
        var browserBtn = document.getElementById('browser-btn');

        if (isIOS) {
          title.textContent = 'Open Malcon Nexus app';
          message.innerHTML =
            'On iPhone, Telegram cannot open the installed app directly.<br><br>' +
            '<strong>Tap the Malcon Nexus icon on your Home Screen.</strong>';
          browserBtn.classList.remove('hidden');
          browserBtn.href = appUrl;
          return;
        }

        if (isAndroid && isInAppBrowser) {
          title.textContent = 'Opening in Chrome…';
          message.textContent =
            'If you installed Malcon Nexus on your phone, enable “Open supported links” in app settings so Chrome opens the app.';
          var intentUrl =
            'intent://' +
            location.host +
            '/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
            encodeURIComponent(appUrl) +
            ';end';
          location.href = intentUrl;
          setTimeout(function () {
            title.textContent = 'Open Malcon Nexus';
            message.textContent = 'If nothing happened, use the Malcon Nexus icon on your home screen.';
            homeBtn.classList.remove('hidden');
            homeBtn.href = appUrl;
            browserBtn.classList.remove('hidden');
            browserBtn.href = appUrl;
          }, 1800);
          return;
        }

        location.replace(appUrl);
      })();
    </script>
  </body>
</html>
