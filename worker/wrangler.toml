# Malcon Nexus API — Cloudflare Worker + D1 (+ R2 bindings for future storage).
# NOT wired to the Hostinger SPA yet. Supabase remains production.

name = "malcon-nexus-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Default = local development (`wrangler dev`)
[vars]
ENVIRONMENT = "development"
API_CORS_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "malcon-nexus-dev"
database_id = "local"
migrations_dir = "drizzle/migrations"

# Future R2 (Phase 10+) — bucket names per environment in Cloudflare dashboard
# [[r2_buckets]]
# binding = "STAGE_PHOTOS"
# bucket_name = "malcon-nexus-stage-photos-dev"

# [[r2_buckets]]
# binding = "ATTENDANCE_SELFIES"
# bucket_name = "malcon-nexus-attendance-selfies-dev"

[env.staging]
name = "malcon-nexus-api-staging"
vars = { ENVIRONMENT = "staging", API_CORS_ORIGIN = "https://app-staging.malconnexus.com" }
# After first deploy, attach a route (Dashboard or uncomment and set zone):
# routes = [{ pattern = "api-staging.malconnexus.com/*", zone_name = "malconnexus.com" }]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "malcon-nexus-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "drizzle/migrations"

# [[env.staging.r2_buckets]]
# binding = "STAGE_PHOTOS"
# bucket_name = "malcon-nexus-stage-photos-staging"
# [[env.staging.r2_buckets]]
# binding = "ATTENDANCE_SELFIES"
# bucket_name = "malcon-nexus-attendance-selfies-staging"
# [[env.staging.r2_buckets]]
# binding = "HR_KYC_UPLOADS"
# bucket_name = "malcon-nexus-hr-kyc-uploads-staging"

[env.production]
name = "malcon-nexus-api"
vars = { ENVIRONMENT = "production", API_CORS_ORIGIN = "https://app.malconnexus.com" }
# routes = [{ pattern = "api.malconnexus.com/*", zone_name = "malconnexus.com" }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "malcon-nexus-production"
database_id = "232961fe-ff35-4b9b-a661-b7f9e2e4bf58"
migrations_dir = "drizzle/migrations"

# [[env.production.r2_buckets]]
# binding = "STAGE_PHOTOS"
# bucket_name = "malcon-nexus-stage-photos-production"
# [[env.production.r2_buckets]]
# binding = "ATTENDANCE_SELFIES"
# bucket_name = "malcon-nexus-attendance-selfies-production"
# [[env.production.r2_buckets]]
# binding = "HR_KYC_UPLOADS"
# bucket_name = "malcon-nexus-hr-kyc-uploads-production"

# Secrets (set via `wrangler secret put`, never commit):
# - JWT_SECRET / SESSION signing (future auth)
# - SUPABASE_JWT_JWKS_URL (optional bridge during hybrid auth)
# - TELEGRAM_BOT_TOKEN, RESEND_API_KEY, VAPID_* (when Edge Functions move here)
